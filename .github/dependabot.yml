# Weekly dependency update PRs. Railway deploys only from main, so nothing
# ships until a PR is reviewed and merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    ignore:
      # Keep Node type definitions matched to the runtime (node:22-slim in the
      # Dockerfile). Bump both together when moving to a newer Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # zod 4 drops additionalProperties:false from every tool input schema under
      # the current MCP SDK. Revisit once the SDK adopts zod 4 natively.
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
    groups:
      # The MCP SDK gets its own PR: it's the package most likely to change
      # behavior (protocol versions, transport), so it's worth reviewing alone.
      mcp-sdk:
        patterns:
          - "@modelcontextprotocol/*"
      # Everything else that's a minor or patch bump is batched into one PR.
      minor-and-patch:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "@modelcontextprotocol/*"
